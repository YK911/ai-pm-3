<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Treat yourself or a loved one to our finest ingredients for a moment of pure delight!"
    />
    <meta name="keywords" content="chocolate cacao milk powder nuts" />
    <title>Simply Chocolate</title>
    <link
      rel="shortcut icon"
      href="./images/chocolate.svg"
      type="image/svg+xml"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <a class="logo" href="./home-page.html">
          <i>SIMPLY</i> CHOCOLATE
          <img
            class="logo-icon"
            src="./images/chocolate.svg"
            alt="Simply Chocolate Logo"
            width="21"
            height="21"
            loading="lazy"
          />
        </a>

        <button class="menu-btn" type="button">
          <img
            src="./images/burger-menu.svg"
            alt="Burger menu button"
            width="28"
            height="28"
          />
        </button>

        <nav class="nav">
          <a class="nav-link active" href="#">Home</a>
          <a class="nav-link" href="#">How it’s made?</a>
          <a class="nav-link" href="#">Chocolate is loved</a>
        </nav>

        <ul class="socials">
          <li class="socials-item">
            <a class="socials-link" href="https://facebook.com" target="_blank">
              <img
                class="socials-icon"
                src="./images/facebook.svg"
                alt="Facebook icon"
                width="24"
                height="24"
              />
            </a>
          </li>
          <li class="socials-item">
            <a
              class="socials-link"
              href="https://instagram.com"
              target="_blank"
            >
              <img
                class="socials-icon"
                src="./images/instagram.svg"
                alt="Instagram icon"
                width="24"
                height="24"
              />
            </a>
          </li>
          <li class="socials-item">
            <a class="socials-link" href="https://x.com" target="_blank">
              <img
                class="socials-icon"
                src="./images/twitter.svg"
                alt="The X icon"
                width="24"
                height="24"
              />
            </a>
          </li>
        </ul>
      </div>
    </header>
    <main>
      <section class=""></section>
      <section class=""></section>
      <section class=""></section>
      <section class=""></section>
      <section class=""></section>
      <section class=""></section>
      <section class=""></section>
    </main>
    <footer></footer>
  </body>
</html>
